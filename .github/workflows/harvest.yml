# Keeps the live dashboard up to date on GitHub Pages (free for public repositories).
#   Every hour:  quick check of the newest DTM Nigeria listing pages (about 1 minute)
#   Every night: full crawl (sitemap + all listing pages + keyword searches)
# The dashboard itself re-checks every 5 minutes, so open pages update on their own.
name: Harvest DTM Nigeria reports

on:
  schedule:
    - cron: "7 * * * *"      # hourly quick check
    - cron: "30 1 * * *"     # nightly full crawl, 02:30 Nigeria time
  workflow_dispatch:
    inputs:
      mode:
        description: "full = everything (use for the first run), quick = newest pages only"
        type: choice
        options: [full, quick]
        default: full
      keywords:
        description: "Extra keywords, comma-separated (optional, full mode only)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests beautifulsoup4

      - name: Harvest dtm.iom.int
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then MODE=full; else MODE=quick; fi
          fi
          # without an existing cache a quick run would miss older reports, so do a full crawl first
          if [ ! -f data/cache.json ]; then MODE=full; fi
          echo "Mode: $MODE"
          if [ "$MODE" = "quick" ]; then
            python scrape.py --quick
          elif [ -n "${{ github.event.inputs.keywords }}" ]; then
            python scrape.py --keywords "${{ github.event.inputs.keywords }}"
          else
            python scrape.py
          fi

      - name: Build site
        run: python build_site.py

      - name: Save new data to the repository (only when reports changed)
        run: |
          git config user.name "dtm-harvest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json data/reports.js data/reports.csv data/counts_component_by_year.csv data/cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new reports."
          else
            git commit -m "New DTM Nigeria reports $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
